spring.application.name=playground
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# listener
spring.kafka.listener.concurrency=1
spring.kafka.listener.ack-mode=record

# consumer
spring.kafka.consumer.group-id=${otr.order.ordering.consumer.groups.customer-order:walnut-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=200
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.walnut.playground.*

# producer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.compression-type=lz4

# app topics/groups
event.internal.change.event=${EVENT_INTERNAL_CHANGE_EVENT:demo.internal.change.event}
otr.order.ordering.consumer.groups.customer-order=${KAFKA_CONSUMER_GROUP:walnut-group}